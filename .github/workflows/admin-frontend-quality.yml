name: Admin frontend quality
on:
  push:
    branches: ["feat/admin-portal"]
    paths:
      - "src/app/admin/**"
      - "src/components/admin/**"
      - "docs/ADMIN_FRONTEND_UAT.md"
      - ".github/workflows/admin-frontend-quality.yml"
      - "package.json"
  pull_request:
    branches: ["staging"]
    paths:
      - "src/app/admin/**"
      - "src/components/admin/**"
      - "package.json"
jobs:
  admin-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Production build
        run: npm run build
