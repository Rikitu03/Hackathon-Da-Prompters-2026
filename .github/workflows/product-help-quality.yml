name: Product help quality
on:
  pull_request:
    branches: [staging, main]
  push:
    branches: [feat/gabay-product-help]
jobs:
  product-help:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://mock.supabase.test
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_e2e_mock_key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm run kb:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --maxWorkers=2
      - run: npm run test:applicant
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: product-help-playwright
          path: |
            playwright-report
            test-results
          retention-days: 7
